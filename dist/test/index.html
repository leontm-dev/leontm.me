<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnCode</title>
    <link rel="stylesheet" href="/dist/pages/public/general/styles/fonts.css" />
    <link
      rel="stylesheet"
      href="/dist/pages/public/general/styles/loader.css"
    />
    <link
      rel="stylesheet"
      href="/dist/pages/public/projects/learnCode/style.css"
    />
    <link
      rel="stylesheet"
      href="/dist/pages/public/projects/learnCode/fireButton.css"
    />
    <link
      rel="stylesheet"
      href="/dist/pages/public/projects/learnCode/button.css"
    />
    <link
      rel="stylesheet"
      href="/dist/pages/public/projects/learnCode/theme.css"
    />
    <link
      rel="stylesheet"
      href="/dist/pages/public/projects/learnCode/controls.css"
    />
  </head>
  <body>
    <div class="loader" id="loader">
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div class="page-container" id="page-container">
      <nav class="navbar">
        <div class="nav-item">LearnCode</div>
        <div class="nav-buttons">
          <div class="nav-button">
            <label class="switch-name">
              <input id="mode" type="checkbox" class="checkbox" />
              <div class="back"></div>
              <svg
                class="moon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 384 512"
              >
                <path
                  d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"
                ></path>
              </svg>
              <svg
                class="sun"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
              >
                <path
                  d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"
                ></path>
              </svg>
            </label>
          </div>
          <div class="nav-button">
            <button class="comic-button">Load code</button>
          </div>
        </div>
      </nav>
      <div class="content-container">
        <section id="start">
          <div class="start-contents">
            <button class=""></button>
          </div>
        </section>
        <section id="code">
          <div class="code-container">
            <div class="code-nav">
              <button class="code-control" id="copy">
                <div class="code-control-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-download"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"
                    />
                    <path
                      d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"
                    />
                  </svg>
                </div>
                <div class="code-control-text">Herunterladen</div>
              </button>
              <button class="code-control" id="copy">
                <div class="code-control-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-copy"
                    viewBox="0 0 16 16"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"
                    />
                  </svg>
                </div>
                <div class="code-control-text">Kopieren</div>
              </button>
              <button class="code-control" id="run">
                <div class="code-control-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-play-circle-fill"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M6.79 5.093A.5.5 0 0 0 6 5.5v5a.5.5 0 0 0 .79.407l3.5-2.5a.5.5 0 0 0 0-.814z"
                    />
                  </svg>
                </div>
                <div class="code-control-text">
                  Run (<span>strg</span> + <span>R</span>)
                </div>
              </button>
            </div>
            <textarea
              placeholder="Schreibe deinen Code hier..."
              name=""
              id="codeplace"
            ></textarea>
          </div>
          <div class="output-window">
            <div class="output-header">Ausgabe</div>
            <div class="output">
              <div class="output-line">
                <div class="output-line-index">1</div>
                <div class="output-line-content">Hallo</div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="/dist/pages/public/projects/learnCode/script.js"></script>
  </body>
</html>
